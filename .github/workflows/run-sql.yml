name: Execute SQL on Local Server

on:
  push:
    branches: [ main ]

jobs:
  run-sql:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Install SQL Server PowerShell module
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name SqlServer)) {
            Install-Module -Name SqlServer -Force -Scope CurrentUser
          }
          Import-Module SqlServer

      - name: Run createdb.sql
        shell: pwsh
        run: |
          # disable certificate validation for local/self-signed
          $ErrorActionPreference = "Stop"
          $params = @{
            ServerInstance = "GADIPUDI"
            Database       = "master"
            InputFile      = "${{ github.workspace }}\createdb.sql"
            TrustServerCertificate = $true
          }
          Invoke-Sqlcmd @params
